<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="admin-wrap">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../images/logo.png" alt="IVN TECH Logo">
      <div class="sidebar-brand-text">
        <strong>IVN TECH</strong>
        <span>Admin Panel</span>
      </div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section-label">Main Menu</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        Dashboard
      </a>
      <a href="customers.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Customers
      </a>
      <a href="quotations.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
        Quotations
      </a>
      <a href="invoices.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
        Invoices
      </a>
    </nav>
    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
      <a href="../index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Website
      </a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left">
        <span class="admin-header-title">Dashboard</span>
      </div>
      <div class="admin-header-right">
        <div class="admin-avatar">A</div>
      </div>
    </header>

    <nav class="mobile-admin-nav">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="customers.html">Customers</a>
      <a href="quotations.html">Quotations</a>
      <a href="invoices.html">Invoices</a>
    </nav>

    <div class="admin-content">
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:24px;">Dashboard</h1>
      <div class="dash-cards" id="dashCards"></div>
    </div>
  </div>
</div>

<script src="../js/store.js"></script>
<script>
  const customers = Store.getCustomers();
  const quotations = Store.getQuotations();
  const invoices = Store.getInvoices();
  const paid = invoices.filter(i => i.paymentStatus === "Paid");
  const pending = invoices.filter(i => i.paymentStatus !== "Paid");
  const revenue = paid.reduce((s, inv) => s + Store.grandTotal(inv.items, inv.discount), 0);

  const cards = [
    { label: "Total Customers", value: customers.length, color: "#3b82f6" },
    { label: "Total Quotations", value: quotations.length, color: "#6366f1" },
    { label: "Pending Quotations", value: quotations.length, color: "#ca8a04" },
    { label: "Total Invoices", value: invoices.length, color: "#8b5cf6" },
    { label: "Paid Invoices", value: paid.length, color: "#16a34a" },
    { label: "Pending Payments", value: pending.length, color: "#dc2626" },
    { label: "Total Revenue", value: "Rs. " + revenue.toLocaleString(), color: "#059669" },
  ];

  document.getElementById("dashCards").innerHTML = cards.map(c => `
    <div class="dash-card">
      <div class="dash-card-icon" style="background:${c.color}">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/></svg>
      </div>
      <div>
        <div class="dash-card-label">${c.label}</div>
        <div class="dash-card-value">${c.value}</div>
      </div>
    </div>
  `).join("");
</script>
</body>
</html>
