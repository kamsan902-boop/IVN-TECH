<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers – IVN TECH Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="admin-wrap">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../images/logo.png" alt="IVN TECH Logo">
      <div class="sidebar-brand-text"><strong>IVN TECH</strong><span>Admin Panel</span></div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section-label">Main Menu</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
      <a href="customers.html" class="active"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Customers</a>
      <a href="quotations.html"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg> Quotations</a>
      <a href="invoices.html"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg> Invoices</a>
    </nav>
    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
      <a href="../index.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Back to Website</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><span class="admin-header-title">Customers</span></div>
      <div class="admin-header-right"><div class="admin-avatar">A</div></div>
    </header>
    <nav class="mobile-admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="customers.html" class="active">Customers</a>
      <a href="quotations.html">Quotations</a>
      <a href="invoices.html">Invoices</a>
    </nav>

    <div class="admin-content">
      <div class="flex-between mb-24">
        <h1 style="font-size:1.5rem;font-weight:700;">Customers</h1>
        <button class="btn btn-accent btn-sm" onclick="showForm()">+ Add Customer</button>
      </div>

      <!-- Form -->
      <div class="form-panel hidden" id="customerForm">
        <div class="flex-between">
          <h2 id="formTitle">New Customer</h2>
          <button class="btn-icon" onclick="hideForm()">&times;</button>
        </div>
        <form onsubmit="saveCustomer(event)">
          <div class="form-row form-row-2">
            <div><label>Name</label><input class="form-input" id="cName" required></div>
            <div><label>Phone</label><input class="form-input" id="cPhone" required></div>
          </div>
          <div class="form-row form-row-2">
            <div><label>Email</label><input class="form-input" id="cEmail"></div>
            <div><label>Address</label><input class="form-input" id="cAddress"></div>
          </div>
          <div class="form-row">
            <div><label>Project / Service</label><input class="form-input" id="cProject"></div>
          </div>
          <button type="submit" class="btn btn-accent btn-sm" id="formBtn">Save</button>
        </form>
      </div>

      <!-- Search -->
      <div class="search-box mb-24" style="max-width:280px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="form-input" placeholder="Search customers..." id="searchBox" oninput="renderTable()">
      </div>

      <!-- Table -->
      <div class="card">
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Name</th><th>Phone</th><th>Email</th><th>Project</th><th>Quotes</th><th>Invoices</th><th></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/store.js"></script>
<script>
  let editId = null;

  function showForm(id) {
    editId = id || null;
    document.getElementById("customerForm").classList.remove("hidden");
    document.getElementById("formTitle").textContent = id ? "Edit Customer" : "New Customer";
    document.getElementById("formBtn").textContent = id ? "Update" : "Save";
    if (id) {
      const c = Store.getCustomer(id);
      document.getElementById("cName").value = c.name;
      document.getElementById("cPhone").value = c.phone;
      document.getElementById("cEmail").value = c.email || "";
      document.getElementById("cAddress").value = c.address || "";
      document.getElementById("cProject").value = c.project || "";
    } else {
      document.getElementById("cName").value = "";
      document.getElementById("cPhone").value = "";
      document.getElementById("cEmail").value = "";
      document.getElementById("cAddress").value = "";
      document.getElementById("cProject").value = "";
    }
  }

  function hideForm() { document.getElementById("customerForm").classList.add("hidden"); editId = null; }

  function saveCustomer(e) {
    e.preventDefault();
    const data = {
      name: document.getElementById("cName").value,
      phone: document.getElementById("cPhone").value,
      email: document.getElementById("cEmail").value,
      address: document.getElementById("cAddress").value,
      project: document.getElementById("cProject").value,
    };
    if (editId) Store.updateCustomer(editId, data);
    else Store.addCustomer(data);
    hideForm(); renderTable();
  }

  function deleteCustomer(id) {
    if (confirm("Delete this customer?")) { Store.deleteCustomer(id); renderTable(); }
  }

  function renderTable() {
    const search = (document.getElementById("searchBox").value || "").toLowerCase();
    const customers = Store.getCustomers().filter(c =>
      c.name.toLowerCase().includes(search) || c.phone.includes(search) || (c.email || "").toLowerCase().includes(search)
    );
    const quotes = Store.getQuotations();
    const invs = Store.getInvoices();

    document.getElementById("tableBody").innerHTML = customers.length === 0
      ? '<tr><td colspan="7" class="empty-state">No customers found.</td></tr>'
      : customers.map(c => {
          const qc = quotes.filter(q => q.customerId === c.id).length;
          const ic = invs.filter(i => i.customerId === c.id).length;
          return `<tr>
            <td><strong>${c.name}</strong></td><td>${c.phone}</td><td>${c.email || "-"}</td>
            <td>${c.project || "-"}</td><td>${qc}</td><td>${ic}</td>
            <td class="text-right">
              <button class="btn-icon" onclick="showForm('${c.id}')" title="Edit">&#9998;</button>
              <button class="btn-icon" onclick="deleteCustomer('${c.id}')" title="Delete" style="color:var(--red)">&#10005;</button>
            </td>
          </tr>`;
        }).join("");
  }
  renderTable();
</script>
</body>
</html>
